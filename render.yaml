# Render Blueprint - lets Render provision this service automatically from
# the repo (New -> Blueprint), instead of clicking through the New Web
# Service form by hand. Either path works since the Dockerfile is already
# PORT-aware; this file just makes the setup reproducible and versioned.
#
# Secrets (LLM_API_KEY) are intentionally NOT set here - `sync: false` means
# Render will prompt for it in the dashboard rather than committing it to
# git.
services:
  - type: web
    name: spec2program
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_KEY
        sync: false
      # Selected by measurement (see README "Choosing the model"): fastest
      # model that was rule-valid on every run, and cheaper per generation
      # than the reasoning models tried.
      - key: LLM_MODEL
        value: meta-llama/llama-3.3-70b-instruct
      - key: LLM_TEMPERATURE
        value: "0.1"
      # LLM_MAX_TOKENS is deliberately NOT set. Reasoning models (the default
      # deepseek-v4-flash included) count hidden reasoning tokens against it,
      # so a cap sized against the visible JSON truncates the reply mid-document
      # and throws away the whole call.
      # Batch mode overlaps its LLM calls; keep the connection pool at least
      # as large as the worker count so concurrent specs never queue.
      - key: BATCH_MAX_WORKERS
        value: "8"
      - key: LLM_MAX_CONNECTIONS
        value: "20"
      - key: CORS_ORIGINS
        value: "*"
